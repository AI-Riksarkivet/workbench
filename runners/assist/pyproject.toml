# The `assist` runner — the annotator's interactive AI-assist model server (ONLINE, CPU).
# Serves the `MEDIA_ASSIST_URL` contract (services/annotator/api/v1/endpoints/assist.py::_remote):
# GroundingDINO-tiny for text-prompted open-vocabulary detection + SAM-ViT-base for box/point
# segmentation. Deliberately CPU wheels (the pytorch cpu index below) — proven ~2.5 s/frame
# detection + ~1.8 s/frame segmentation on the 64-core box, no CUDA anywhere in this env.
# Unlike the offline Ray Data runners this one ships as its OWN image
# (.docker/assist-runner.dockerfile), so it carries a committed uv.lock for a --frozen build.
[project]
name = "ratch-runner-assist"
version = "0.0.0"
description = "Interactive assist model server (GroundingDINO-tiny + SAM-ViT-base, CPU) behind MEDIA_ASSIST_URL."
requires-python = ">=3.12,<3.14"
license = "Apache-2.0"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "pydantic-settings>=2.6",
    "transformers>=4.49",
    "torch==2.9.1+cpu",
    "pillow>=13.0.0",
    # Floor at the first release without the advisories Dependabot reports on this lock.
    "certifi>=2026.10.23",
    "numpy>=2,<3",
    "opencv-python-headless>=4.10",
]

[tool.uv]
package = false

# The +cpu wheels live only on the pytorch index (local-version pins are not on PyPI), and this env must never pull CUDA.
# The index is explicit: it serves torch alone, so a package it also mirrors at an older release (certifi 2022.12.7,
# which carries an advisory) resolves from PyPI.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
