{{- $name := include "annotator.name" . -}}
{{- if .Values.route.enabled }}
{{- if not .Values.route.parentRefs }}{{ fail "route.parentRefs must name the Gateway the workbench's routes attach to" }}{{ end }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $name }}
  labels:
    {{- include "annotator.selector" . | nindent 4 }}
spec:
  parentRefs:
    {{- toYaml .Values.route.parentRefs | nindent 4 }}
  {{- with .Values.route.hostnames }}
  hostnames:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    {{- range .Values.route.doors }}
    {{- if not (regexMatch "^/[a-z0-9/_-]+$" .) }}{{ fail (printf "route.doors: %s is not a path" .) }}{{ end }}
    - matches:
        - path: { type: PathPrefix, value: {{ printf "%s%s" $.Values.route.prefix . | quote }} }
      filters:
        - type: URLRewrite
          urlRewrite:
            path: { type: ReplacePrefixMatch, replacePrefixMatch: {{ . | quote }} }
      backendRefs:
        - name: {{ $name }}
          port: {{ $.Values.port }}
    {{- end }}
{{- end }}
{{- if .Values.networkPolicy.enabled }}
{{- if .Values.route.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $name }}-edge
  labels:
    {{- include "annotator.selector" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "annotator.selector" . | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    {{- /* The Gateway's data plane is the platform's, so this chart cannot know its pods: unnamed, every source may reach
    the app port, and each request still proves its person. `networkPolicy.edgeFrom` names those pods instead. */}}
    - ports:
        - { protocol: TCP, port: {{ .Values.port }} }
      {{- with .Values.networkPolicy.edgeFrom }}
      from:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
{{- end }}
