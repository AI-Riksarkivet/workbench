{{- /*
The workbench's model writer, run before the services roll: the store named `auth.fga.store` holds the model this
image carries, exactly the organisations `auth.fga.orgs` declares, and exactly the `readers` each source the workbench
decides for declares (`reader` on `source:<name>`; `service_kit.governed.auth.write_model`). A hook,
so a new image's model is in the store before its pods look for it; run again with nothing changed, it writes nothing.
*/ -}}
{{- if .Values.auth.enabled }}
{{- $name := include "annotator.name" . -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}-declaration
  labels:
    {{- include "annotator.selector" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: before-hook-creation
data:
  orgs.json: {{ dict "orgs" .Values.auth.fga.orgs | toJson | quote }}
  sources.json: {{ include "workbench.sources" . | quote }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $name }}-openfga-model
  labels:
    {{- include "annotator.selector" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        {{- include "annotator.selector" . | nindent 8 }}
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: model-writer
          image: "{{ .Values.image.repository }}:{{ required "image.tag must be set" .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["python", "-m", "service_kit.governed.auth.write_model"]
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          env:
            {{- include "workbench.fgaEnv" . | nindent 12 }}
            - { name: WORKBENCH_FGA_ORGS_FILE, value: /etc/workbench/declaration/orgs.json }
            - { name: WORKBENCH_SOURCES_FILE, value: /etc/workbench/declaration/sources.json }
          volumeMounts:
            - { name: declaration, mountPath: /etc/workbench/declaration, readOnly: true }
            {{- if .Values.auth.fga.credential.name }}
            - { name: fga-credential, mountPath: /var/run/secrets/workbench/fga, readOnly: true }
            {{- end }}
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { cpu: 500m, memory: 256Mi }
      volumes:
        - name: declaration
          configMap:
            name: {{ $name }}-declaration
        {{- with .Values.auth.fga.credential.name }}
        - name: fga-credential
          secret:
            secretName: {{ . }}
            items: [{ key: {{ $.Values.auth.fga.credential.key }}, path: preshared-key }]
        {{- end }}
{{- end }}
