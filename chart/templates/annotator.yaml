{{- $r := .Release.Name -}}
{{- $name := include "annotator.name" . -}}
{{- $state := .Values.state -}}
{{- $l := .Values.lifecycle -}}
{{- $drain := sub $l.terminationGracePeriodSeconds (add $l.preStopSeconds $l.teardownSeconds) -}}
{{- if le (int $drain) 0 }}{{ fail "lifecycle: need teardownSeconds < terminationGracePeriodSeconds - preStopSeconds" }}{{ end -}}
{{- if eq (toString .Values.forwardedAllowIps) "*" }}{{ fail "forwardedAllowIps must not be '*': any client could forge its own source IP" }}{{ end -}}
{{- $selector := include "annotator.selector" . | fromYaml -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $r }}-annotator
  labels:
    {{- toYaml $selector | nindent 4 }}
automountServiceAccountToken: false
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- toYaml $selector | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.port }}
      targetPort: http
  selector:
    {{- toYaml $selector | nindent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- toYaml $selector | nindent 4 }}
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      {{- toYaml $selector | nindent 6 }}
  template:
    metadata:
      annotations:
        # A changed declaration rolls the pods: the sources are read once, at start.
        checksum/sources: {{ include "workbench.sources" . | sha256sum | trunc 16 }}
      labels:
        {{- toYaml $selector | nindent 8 }}
        lance.dev/logs: otlp
    spec:
      terminationGracePeriodSeconds: {{ $l.terminationGracePeriodSeconds }}
      serviceAccountName: {{ $r }}-annotator
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: annotator
          image: "{{ .Values.image.repository }}:{{ required "image.tag must be set" .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - "uvicorn"
            - "annotator.main:app"
            - "--host=0.0.0.0"
            - "--port={{ .Values.port }}"
            - "--timeout-graceful-shutdown={{ $drain }}"
            - "--proxy-headers"
            - "--forwarded-allow-ips={{ .Values.forwardedAllowIps }}"
            # No access log: the app writes one line per request naming its route's template, never its path or query.
            - "--no-access-log"
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep {{ $l.preStopSeconds }}"]
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            - { name: state-password, mountPath: /var/run/secrets/annotator/state-password, readOnly: true }
            - { name: state-ca, mountPath: /var/run/secrets/annotator/state-ca, readOnly: true }
            {{- include "workbench.sourcesMount" . | nindent 12 }}
            {{- if include "workbench.lakehouseAuth" . }}
            - { name: oidc-client, mountPath: /var/run/secrets/workbench/oidc-client, readOnly: true }
            {{- end }}
            {{- if .Values.auth.enabled }}
            {{- if .Values.auth.fga.credential.name }}
            - { name: fga-credential, mountPath: /var/run/secrets/workbench/fga, readOnly: true }
            {{- end }}
            {{- end }}
            {{- if .Values.models.endpoint.url }}
            - { name: model-endpoint-identity, mountPath: /var/run/secrets/workbench/model-endpoint, readOnly: true }
            {{- end }}
            {{- include "workbench.otelMount" . | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.port }}
          env:
            - { name: WORKBENCH_DOCS, value: {{ .Values.docs | quote }} }
            # The sources this release declares: the items' datasets are read through lance-namespace, a lakehouse's on the
            # credential its catalog vends the person, so the pod holds no store key. The work in progress is the annotator's
            # own state below; only a publish writes to a lakehouse.
            {{- include "workbench.sourcesEnv" . | nindent 12 }}
            # The annotator's own state: a database of the platform's PostgreSQL, by the address `state` names, the
            # server verified against the CA it names, the password read from its mounted file on every new connection.
            - { name: ANNOTATOR_STATE_HOST, value: {{ required "state.host: the PostgreSQL the annotator keeps its state on, which the platform provides" $state.host | quote }} }
            - { name: ANNOTATOR_STATE_PORT, value: {{ $state.port | quote }} }
            - { name: ANNOTATOR_STATE_DATABASE, value: {{ $state.database | quote }} }
            - { name: ANNOTATOR_STATE_USER, value: {{ $state.user | quote }} }
            - { name: ANNOTATOR_STATE_SSLMODE, value: "verify-full" }
            - { name: ANNOTATOR_STATE_CA_FILE, value: /var/run/secrets/annotator/state-ca/ca.crt }
            - { name: ANNOTATOR_STATE_PASSWORD_FILE, value: /var/run/secrets/annotator/state-password/password }
            {{- with .Values.models.endpoint }}
            {{- if .url }}
            # The model endpoint assist asks (ADR 0023): called as this pod, on its own ServiceAccount token for the
            # endpoint's audience, projected by the kubelet and read on every call.
            - { name: ANNOTATOR_MODEL_ENDPOINT_URL, value: {{ .url | quote }} }
            - { name: ANNOTATOR_MODEL_ENDPOINT_TOKEN_FILE, value: /var/run/secrets/workbench/model-endpoint/token }
            - { name: ANNOTATOR_MODEL_ENDPOINT_TIMEOUT_SECONDS, value: {{ .timeoutSeconds | quote }} }
            {{- end }}
            {{- end }}
            {{- include "workbench.otelEnv" (list . "annotator") | nindent 12 }}
            {{- if .Values.auth.enabled }}
            {{- include "annotator.authEnv" . | nindent 12 }}
            {{- else }}
            # Authentication off, said the one loud way the services accept: a local stack only.
            - { name: WORKBENCH_OIDC_ENABLED, value: "false" }
            - { name: WORKBENCH_INSECURE_ALLOW_UNAUTHENTICATED, value: "true" }
            {{- end }}
          startupProbe:
            httpGet: { path: /livez, port: http }
            periodSeconds: 10
            failureThreshold: 30
            timeoutSeconds: 5
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet: { path: /livez, port: http }
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - { name: tmp, emptyDir: { sizeLimit: "2Gi" } }
        # The state database's password alone: the kubelet mounts it, so the pod's ServiceAccount needs no grant to
        # read Secrets.
        - name: state-password
          secret:
            secretName: {{ required "state.password.name: the Secret holding the state database's password" $state.password.name }}
            items: [{ key: {{ $state.password.key }}, path: password }]
        {{- include "workbench.sourcesVolume" . | nindent 8 }}
        {{- if include "workbench.lakehouseAuth" . }}
        # The workbench's confidential client's secret: the token exchange and its own token for the lakehouse.
        - name: oidc-client
          secret:
            secretName: {{ required "auth.oidc.client.secret.name: the Secret holding the workbench client's secret" .Values.auth.oidc.client.secret.name }}
            items: [{ key: {{ .Values.auth.oidc.client.secret.key }}, path: client-secret }]
        {{- end }}
        {{- if .Values.auth.enabled }}
        {{- with .Values.auth.fga.credential.name }}
        - name: fga-credential
          secret:
            secretName: {{ . }}
            items: [{ key: {{ $.Values.auth.fga.credential.key }}, path: preshared-key }]
        {{- end }}
        {{- end }}
        # The certificate authority the state database's certificate is verified against, alone.
        - name: state-ca
          secret:
            secretName: {{ required "state.ca.name: the Secret holding the CA the state database's certificate is verified against" $state.ca.name }}
            items: [{ key: {{ $state.ca.key }}, path: ca.crt }]
        {{- with .Values.models.endpoint }}
        {{- if .url }}
        # The pod's own identity at the model endpoint, for that audience alone.
        - name: model-endpoint-identity
          projected:
            sources:
              - serviceAccountToken: { path: token, audience: {{ required "models.endpoint.audience: the audience the model endpoint verifies a caller's token for" .audience | quote }}, expirationSeconds: {{ .expirationSeconds }} }
        {{- end }}
        {{- end }}
        {{- include "workbench.otelVolume" . | nindent 8 }}
