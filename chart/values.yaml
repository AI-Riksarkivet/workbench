# The workbench: the app, the annotator, the viewer and search. Every object is named from the release
# (`<release>-annotator`, `<release>-viewer`, `<release>-search`, `<release>-app`, `<release>-annotator-state`).

image:
  # A bare name is a side-loaded image on the node (make k3s-import); a registry path is pulled.
  repository: annotator
  tag: dev
  pullPolicy: IfNotPresent

# Replicas share the state in the Cluster below: a transition locks its rows there, so any replica may serve any request.
replicas: 1
port: 8103

# The Gateway routes publishing the workbench: the app at `/`, each service at its prefix. They attach to the platform's
# Gateway (`parentRefs`), under `hostnames` where the workbench has a host of its own.
route:
  enabled: true
  # The annotator's public base: each door below is published at `<prefix><door>` and rewritten to the service's own
  # `<door>`, so the base is what the browser's DPoP proofs name (`auth.oidc.publicUrl` is the origin and this prefix)
  # and what the app's `/config.json` names as the annotator. Only these doors are published: the job door
  # callbacks stay inside the cluster. Every route under them verifies the person's DPoP-bound token and proof
  # (`services/annotator/tests/test_every_browser_route_verifies_the_person.py`) and asks the project's role for its
  # action in the workbench's own store.
  prefix: /api/annotator
  doors:
    # who the reader is, and their organisations
    - /me
    # a project's annotations, tags and versions (`?project=`)
    - /api/annotations
    # the project plane: projects, their members, events, adjudications, items and task listing
    - /projects
    # one task: its events (claim, submit, review, ...), its draft and imports
    - /tasks
  # The Gateway the routes attach to. Required while `enabled`.
  parentRefs: []
  # The hosts the routes answer for; empty answers every host the Gateway serves. A route naming a host wins over one
  # naming none (Gateway API precedence), so a workbench host coexists with another app holding `/` on the same Gateway.
  hostnames: []

# On, this release renders its own policies and depends on no other policy (`templates/route.yaml`, `app.yaml`,
# `media.yaml`), each selecting only this release's pods:
# - each service (annotator, viewer, search) and the app admit their own port, from `edgeFrom` when named, else from any
#   source (the Gateway's pods are the platform's, and a kubelet probe reaches the port too); their egress is not
#   restricted, so they reach DNS, the identity provider, the catalog, the store a vended credential names and OpenFGA;
# - the app may dial nothing (it serves files);
# - the state Cluster's instances admit only the annotator's pods and each other on 5432 and the CloudNativePG operator
#   on the status port, and dial only each other, DNS and the API server.
# NetworkPolicies are additive: the database is reachable only by the annotator where no other policy of the namespace
# admits its instances, so the release takes a namespace of its own. Off, it renders no policy.
networkPolicy:
  enabled: false
  # The Gateway data plane's pods, as NetworkPolicy peers; empty admits any source to the app port.
  edgeFrom: []
  # The egress rules reaching the Kubernetes API server as a policy sees it (after the Service's translation), which the
  # state Cluster's instance managers watch it through. Required while `enabled`.
  apiServerEgress: []
  # Name resolution for the state Cluster's instances (a standby dials its primary by the Cluster's Service name).
  dnsEgress:
    - to:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: kube-system }
          podSelector:
            matchLabels: { k8s-app: kube-dns }
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
# Interactive API docs (MEDIA_DOCS).
docs: false
# Peers whose x-forwarded-* headers uvicorn trusts (the Gateway's data plane); `*` is refused.
forwardedAllowIps: 127.0.0.1

# The sources the workbench reads, declared here and rendered into the file every service reads
# (`<release>-sources`, `client_kit.sources`); several in one release, each a dataset id's prefix (`<name>~<namespace>`):
# - `kind: rask`: a rask lakehouse by its catalog's REST door (`uri`, `http://<rask>-catalog.<namespace>:2333`), read as
#   the person (`identity: person`, under `auth.lakehouse`: the lakehouse decides every read) or as the workbench's own
#   client (`service`: the workbench decides, by `readers`). At most one; only its datasets are annotated and
#   published to, and only it is sent a token.
# - `kind: namespace`: any lance-namespace implementation (`impl`, `dir` or `rest`) and its `properties`; with `claim`,
#   a PersistentVolumeClaim mounted read-only as the `dir` root. Its tables are read only under its `dir` root or the
#   store prefixes `locations` names (required for any other `impl`), on the `storage` options it declares.
# - `kind: tables`: a bare Lance table (`uri` ending `.lance`) or a directory of them, by `uri`, or by `path` on a
#   `claim`; `storage` names object-store options (a region, an endpoint).
# Read-only every one but the lakehouse. No source names a credential: properties and storage options are held to the
# allow-list in `files/source-keys.json`, and a store is reached on the catalog's vend or the workload's own identity
# (`storeIdentity`). Every source but a lakehouse read as the person names its `readers`
# (`{orgs: [<org>], people: [<idp-id>~<subject>]}`), the only people who may read it; with none, nobody may. Each takes
# a `title` the dataset list shows.
sources: []

# The workload's own identity at an object store, for a source whose store trusts the cluster's ServiceAccount tokens
# (S3 web identity, Azure workload identity): with `audience` named, the viewer and search mount their ServiceAccount's
# token for that audience at `/var/run/secrets/workbench/store/token` (rotated by the kubelet, valid `expirationSeconds`),
# which a source's `storage` names (`aws_web_identity_token_file` with `aws_role_arn`, or `azure_federated_token_file`).
# Empty mounts none, and a store is then reached only as the platform grants the pod otherwise.
storeIdentity:
  audience: ""
  expirationSeconds: 600

# The annotator's own state: its projects, tasks, drafts and claims are rows in a CloudNativePG Postgres this release
# renders (the CloudNativePG operator is a prerequisite: in development the `cloudnative-pg` fixture); which pods may
# reach it is `networkPolicy`'s, with what that needs of the namespace. The pod mounts the Cluster's generated `<cluster>-app` password and its CA as files,
# and verifies the server's certificate against that CA on every connection.
state:
  instances: 1
  storage: 2Gi
  # The Postgres image the Cluster runs; empty takes the operator's default for its version.
  imageName: ""
  # The CloudNativePG operator's namespace and its pods' labels, admitted to each instance's status port while
  # `networkPolicy.enabled`.
  operatorNamespace: cnpg-system
  operatorPodLabels: { app.kubernetes.io/name: cloudnative-pg }

# The pods' grace period, the preStop drain, and the lifespan teardown after uvicorn's drain.
lifecycle:
  terminationGracePeriodSeconds: 40
  preStopSeconds: 5
  teardownSeconds: 10

# Telemetry to an OTLP/HTTP endpoint (`endpoint`, required while enabled); off sends nothing.
otel:
  enabled: false
  endpoint: ""
  environment: ""

# Sign-in and authorization, the workbench's own. Every request names a person the platform's OIDC provider vouched for,
# in a token addressed to the workbench's own audience; what they may do is the workbench's own OpenFGA store. Any OIDC
# provider: where it binds tokens with DPoP and exchanges its own tokens (RFC 8693, Keycloak), the person's token is
# DPoP-bound and exchanged for the lakehouse's audience; where it does neither (Dex), the sign-in asks for the
# lakehouse's audience too (`app.oidc.scopes`), the token is a bearer, and the services pass it on.
# Off (a local stack only), every service answers anonymously and every check allows, and says so at startup
# (WORKBENCH_INSECURE_ALLOW_UNAUTHENTICATED); a production install leaves it on.
auth:
  enabled: true
  # Emit the authn/authz audit stream (WORKBENCH_AUDIT_ENABLED).
  audit: true
  oidc:
    # The provider's issuer, exactly: a token is accepted only when its `iss` equals it. Required.
    issuer: ""
    # Where discovery and the key set are fetched when that differs from the issuer (a provider behind a proxy).
    discoveryUrl: ""
    # The workbench's own audience: a token addressed to anything else is refused. Keycloak: the audience its mapper
    # adds; Dex: the app's public client id (`app.oidc.clientId`), the one audience no other client's token names.
    audience: workbench
    # The idp id the provider's people are principals of (`<idp-id>~<subject>`), the lakehouse's for the same issuer
    # (rask's `auth.oidc.idpId`), so a grant in either names the same person. Required.
    idpId: ""
    # The claims a person's subject is read from, the first carried winning; empty is `sub` (rask's `subjectClaims`).
    subjectClaims: []
    # The idp id each Dex connector's people are principals of (rask's `auth.oidc.connectors`; the dev Dex's `local` is
    # `dex`). Under it the app asks for `federated:id`, and `subjectClaims` is never read.
    connectors: {}
    # How the issuer marks a token its client was issued for itself, which names no person (rask's `clientMarker`).
    clientMarker: {}
    # Further issuers people sign in at, each `{issuer, idp_id, discovery_url, subject_claims, connectors,
    # client_marker, allow_insecure, lakehouse}` (rask's `auth.oidc.providers`, plus the two the workbench needs):
    # `allow_insecure` admits an http issuer, for a development provider only; `lakehouse` is how its people's reads
    # reach the lakehouse, `{delegation: exchange, client_id, client_secret_file, audience_scope}` (a token is only ever
    # exchanged at the issuer that signed it, by the client named for it there) or `{delegation: forward}`; without it,
    # its people's lakehouse reads are refused.
    providers: []
    # The origin the browser addresses the workbench by (`https://workbench.example`): each service's public URL is it
    # and the service's route prefix, which a DPoP proof's `htu` names. Required.
    publicOrigin: ""
    # Whether every token must come with a DPoP proof. Keep it on wherever the provider binds tokens (its discovery
    # advertises `dpop_signing_alg_values_supported`); off only for one that binds none (Dex), and then a bearer is
    # accepted only when it names no key.
    dpopRequired: true
    # How far a DPoP proof's `iat` may lie from now, and how long its `jti` is remembered against a replay.
    dpopWindowSeconds: 60
    # The workbench's confidential client at the provider: it exchanges a person's token for one addressed to the
    # lakehouse (where `auth.lakehouse.delegation` is exchange) and takes its own for the writes it makes as itself.
    # Its secret is mounted from a Secret.
    client:
      id: workbench-services
      secret:
        # The Secret holding the client's secret, which the platform's secret operator provides. Required.
        name: ""
        key: client-secret
  # The lakehouse, as the services reach it.
  lakehouse:
    # The lakehouse's audience (rask's `auth.oidc.audience`): the audience of every token the services present to it.
    # Required.
    audience: ""
    # The scope the workbench's own client asks for to be issued a token for that audience, where the provider reads
    # the audience from a scope (Dex: `audience:server:client_id:<audience>`); empty asks with the `audience` parameter.
    audienceScope: ""
    # How a person's read reaches the lakehouse: `exchange` (RFC 8693 at the provider, which must exchange its own
    # tokens: Keycloak) or `forward` (the person's token, which the sign-in asked for the lakehouse's audience too, is
    # passed on unchanged: Dex). `forward` needs `auth.oidc.dpopRequired: false`.
    delegation: exchange
  # The lakehouse namespace holding the workbench's annotation tables (`<warehouse>$<namespace>`), which the workbench's
  # own identity is granted to write in the lakehouse: one table per (project, dataset).
  annotationsNamespace: workbench$annotations
  # The workbench's own OpenFGA store, on the platform's OpenFGA, by reference.
  fga:
    # The platform's OpenFGA. Required.
    apiUrl: ""
    # The store's name: the model writer creates it, and the annotator finds it by it.
    store: workbench
    # The Secret holding the store's preshared key, mounted as a file; empty presents none, which only an OpenFGA
    # authenticating nobody admits.
    credential:
      name: ""
      key: preshared-key
    # The organisations git declares: who administers each and who belongs to it, by principal key. The model writer
    # makes the store hold exactly these, and nothing else grants an organisation role.
    orgs: {}
    #   acme:
    #     admins: [keycloak~3f1c...]
    #     members: [keycloak~9a02...]

# Assist producer discovery from a Ray Serve control plane (ANNOTATOR_SERVE_DISCOVERY_URL / _PROXY_URL); empty renders
# none, and assist answers from its registry and its mock.
serve:
  discoveryUrl: ""
  proxyUrl: ""

# The assist runner: the annotator's interactive model server (GroundingDINO-tiny + SAM-ViT-base, CPU, runners/assist).
# Off, assist answers with its deterministic mock.
assist:
  enabled: false
  image:
    repository: assist-runner
    tag: dev
  port: 8110
  # The origin the runner fetches frames from (the viewer). Empty derives `http://<release>-viewer:<port>`.
  frameBase: ""
  # Two warm torch models: the request-pod default would OOM-kill the runner at load.
  resources:
    requests: { cpu: "1", memory: 2Gi }
    limits: { cpu: "8", memory: 6Gi }

resources:
  requests: { cpu: 100m, memory: 512Mi }
  limits: { cpu: "1", memory: 1536Mi }

# The workbench app: the one browser-only single-page app (`frontend/app`, the `frontend` image), a Deployment that
# serves only static files, published at `/` on the same Gateway. It signs people in with PKCE on the workbench's own
# public client at the platform's OIDC provider, binds their tokens to the tab with DPoP where the provider's discovery
# offers it, and calls every service same-origin. Its `/config.json` is a ConfigMap rendered from these values and
# `auth`: with `auth.enabled` off it says `{"signIn": false}`.
app:
  enabled: true
  image:
    repository: workbench-app
    tag: dev
    pullPolicy: IfNotPresent
  replicas: 1
  port: 3000
  # The workbench's own PUBLIC client at the provider (no secret): authorization code with PKCE.
  oidc:
    clientId: workbench-app
    # What the sign-in asks for. Keycloak: the workbench's audience reaches the token through its client scopes (an
    # audience mapper). Dex: add `offline_access` (a refresh token to renew with), `federated:id` (under
    # `auth.oidc.connectors`) and `audience:server:client_id:<lakehouse audience>` (the lakehouse's audience, which
    # its audience client issues to a client it trusts).
    scopes: [openid, profile, email]
    # Whether the app binds its tokens with DPoP: `required` (it signs in only at a provider whose discovery offers
    # DPoP), `offered` (where offered, else a bearer) or `off`. Empty takes the services' rule: `required` under
    # `auth.oidc.dpopRequired`, which refuses any other, and `offered` otherwise.
    dpop: ""
  resources:
    requests: { cpu: 10m, memory: 32Mi }
    limits: { cpu: 200m, memory: 128Mi }

# DEVELOPMENT ONLY: the Secrets the release mounts, made in the cluster rather than by hand, so an install from git is
# complete (`templates/dev-secrets.yaml`). Off, the release names Secrets the platform provides (`auth.oidc.client.secret`,
# `media.viewer.mediaUrlKey`, `auth.fga.credential`), and git holds none of their values.
dev:
  secrets:
    enabled: false
    # The workbench's confidential client's secret, as the development identity provider declares the same client: a
    # development-only literal, as rask's Dex fixture declares its own machine clients'. Never set in production.
    oidcClientSecret: ""

# The viewer and search (`services/viewer`, `services/search`, the `media` image): each reads datasets through the
# catalog's doors as the person, and the viewer signs media links with its key. Each is published at its own prefix on
# the same Gateway, rewritten to the service's root.
media:
  image:
    repository: media
    tag: dev
    pullPolicy: IfNotPresent
  viewer:
    enabled: true
    replicas: 1
    port: 8101
    prefix: /api/viewer
    # The Secret holding the viewer's media-URL signing key (base64 of at least 32 random bytes), mounted as a file.
    # Required while the viewer is enabled.
    mediaUrlKey:
      name: ""
      key: media-url-key
    resources:
      requests: { cpu: 100m, memory: 512Mi }
      limits: { cpu: "1", memory: 1536Mi }
  search:
    enabled: true
    replicas: 1
    port: 8102
    prefix: /api/search
    resources:
      requests: { cpu: 100m, memory: 1Gi }
      limits: { cpu: "2", memory: 3Gi }
