# The workbench authorization model's own tests. The model is read from `model.fga`, never copied here.
#
#   make fga-test       (= `dagger call fga-test`): validate model.fga, run these tests, and diff model.json against it
#
model_file: ./model.fga

tuples:
  # org acme: alice administers it, bob belongs to it
  - { user: user:alice, relation: admin, object: org:acme }
  - { user: user:bob, relation: member, object: org:acme }
  # org beta: frank administers it
  - { user: user:frank, relation: admin, object: org:beta }
  # project p1 belongs to acme; one person on each role
  - { user: org:acme, relation: org, object: project:p1 }
  - { user: user:carol, relation: owner, object: project:p1 }
  - { user: user:dave, relation: manager, object: project:p1 }
  - { user: user:erin, relation: reviewer, object: project:p1 }
  - { user: user:fay, relation: annotator, object: project:p1 }
  - { user: user:gus, relation: viewer, object: project:p1 }
  # project p2 belongs to beta; fay annotates there too
  - { user: org:beta, relation: org, object: project:p2 }
  - { user: user:fay, relation: annotator, object: project:p2 }
  # a task of p1, a corpus bound to p1 and p2, a flow of p1
  - { user: project:p1, relation: project, object: task:t1 }
  - { user: project:p1, relation: project, object: corpus:c1 }
  - { user: project:p2, relation: project, object: corpus:c1 }
  - { user: project:p1, relation: project, object: flow:f1 }
  # source archive is read by acme's members and by gina; source scans names no reader
  - { user: org:acme#member, relation: reader, object: source:archive }
  - { user: user:gina, relation: reader, object: source:archive }

tests:
  - name: a source is read by the organisations and people declared for it, and by nobody else
    check:
      - user: user:bob
        object: source:archive
        assertions: { can_read: true }
      - user: user:alice
        object: source:archive
        assertions: { can_read: true }
      - user: user:gina
        object: source:archive
        assertions: { can_read: true }
      - user: user:frank
        object: source:archive
        assertions: { can_read: false }
      - user: user:gina
        object: source:scans
        assertions: { can_read: false }
    list_objects:
      - user: user:frank
        type: source
        assertions: { can_read: [] }
      - user: user:bob
        type: source
        assertions: { can_read: [source:archive] }
  - name: an org admin owns every project of the org; a member views and creates them
    check:
      - user: user:alice
        object: org:acme
        assertions: { can_administer: true, can_create_project: true, can_list_projects: true }
      - user: user:bob
        object: org:acme
        assertions: { can_administer: false, can_create_project: true, can_list_projects: true }
      - user: user:alice
        object: project:p1
        assertions: { owner: true, can_manage: true, can_publish: true, can_view: true }
      - user: user:bob
        object: project:p1
        assertions: { owner: false, viewer: true, can_view: true, can_annotate: false, can_manage: false }
      - user: user:frank
        object: project:p1
        assertions: { can_view: false, can_manage: false }
      - user: user:carol
        object: org:acme
        assertions: { can_create_project: false, can_list_projects: false }

  - name: the five project roles are concentric
    check:
      - user: user:carol
        object: project:p1
        assertions:
          { owner: true, manager: true, reviewer: true, annotator: true, viewer: true, can_manage: true, can_publish: true, can_review: true, can_annotate: true, can_view: true }
      - user: user:dave
        object: project:p1
        assertions:
          { owner: false, manager: true, can_manage: true, can_publish: true, can_review: true, can_annotate: true, can_claim: true, can_send_items: true, can_view: true }
      - user: user:erin
        object: project:p1
        assertions: { manager: false, can_manage: false, can_publish: false, can_review: true, can_annotate: true, can_claim: true, can_view: true }
      - user: user:fay
        object: project:p1
        assertions: { can_review: false, can_annotate: true, can_claim: true, can_send_items: true, can_view: true }
      - user: user:gus
        object: project:p1
        assertions: { can_annotate: false, can_claim: false, can_send_items: false, can_view: true }
      - user: user:mallory
        object: project:p1
        assertions: { viewer: false, can_view: false, can_annotate: false, can_manage: false }

  - name: creating on the parent
    check:
      - user: user:fay
        object: project:p1
        assertions: { can_create_task: true, can_bind_corpus: true, can_create_flow: false }
      - user: user:gus
        object: project:p1
        assertions: { can_create_task: false, can_bind_corpus: false, can_create_flow: false }
      - user: user:dave
        object: project:p1
        assertions: { can_create_flow: true, can_edit_flow: true }

  - name: flows - owner and manager create, edit and run; reviewer and annotator run; viewer reads
    check:
      - user: user:carol
        object: flow:f1
        assertions: { can_read: true, can_edit: true, can_run: true }
      - user: user:dave
        object: flow:f1
        assertions: { can_read: true, can_edit: true, can_run: true }
      - user: user:erin
        object: flow:f1
        assertions: { can_read: true, can_edit: false, can_run: true }
      - user: user:fay
        object: flow:f1
        assertions: { can_read: true, can_edit: false, can_run: true }
      - user: user:gus
        object: flow:f1
        assertions: { can_read: true, can_edit: false, can_run: false }
      - user: user:bob
        object: flow:f1
        assertions: { can_read: true, can_edit: false, can_run: false }
      - user: user:mallory
        object: flow:f1
        assertions: { can_read: false, can_edit: false, can_run: false }
      - user: user:carol
        object: project:p1
        assertions: { can_run_flow: true, can_read_flow: true }
      - user: user:gus
        object: project:p1
        assertions: { can_run_flow: false, can_read_flow: true }

  - name: a task inherits from its project
    check:
      - user: user:fay
        object: task:t1
        assertions: { can_view: true, can_claim: true, can_annotate: true, can_review: false, can_manage: false }
      - user: user:erin
        object: task:t1
        assertions: { can_review: true, can_manage: false }
      - user: user:dave
        object: task:t1
        assertions: { can_manage: true }
      - user: user:gus
        object: task:t1
        assertions: { can_view: true, can_claim: false, can_annotate: false }
      - user: user:mallory
        object: task:t1
        assertions: { can_view: false }

  - name: a corpus binding lets the project's people view it, nothing more
    check:
      - user: user:fay
        object: corpus:c1
        assertions: { can_view: true }
      - user: user:frank
        object: corpus:c1
        assertions: { can_view: true }
      - user: user:mallory
        object: corpus:c1
        assertions: { can_view: false }
      - user: user:fay
        object: corpus:unbound
        assertions: { can_view: false }

  - name: the owner alone administers a project's owner and manager roles and deletes it
    check:
      - user: user:carol
        object: project:p1
        assertions: { can_administer: true, can_delete: true }
      - user: user:alice
        object: project:p1
        assertions: { can_administer: true, can_delete: true }
      - user: user:dave
        object: project:p1
        assertions: { can_administer: false, can_delete: false, can_manage: true }
      - user: user:erin
        object: project:p1
        assertions: { can_administer: false }

  - name: what a person reaches
    list_objects:
      - user: user:fay
        type: project
        assertions:
          can_annotate: [project:p1, project:p2]
          can_manage: []
      - user: user:alice
        type: project
        assertions:
          can_manage: [project:p1]
      - user: user:gus
        type: flow
        assertions:
          can_read: [flow:f1]
          can_run: []
      - user: user:fay
        type: corpus
        assertions:
          can_view: [corpus:c1]

  - name: who reaches an object
    list_users:
      - object: project:p1
        user_filter:
          - type: user
        assertions:
          can_manage:
            users: [user:alice, user:carol, user:dave]
          can_run_flow:
            users: [user:alice, user:carol, user:dave, user:erin, user:fay]
      - object: org:acme
        user_filter:
          - type: user
        assertions:
          can_administer:
            users: [user:alice]
          can_create_project:
            users: [user:alice, user:bob]
