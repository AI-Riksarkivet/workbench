{{- /*
Every password, generated once in the cluster by the External Secrets Operator's Password generator
(`refreshPolicy: CreatedOnce`), so none is in git or in any environment: the superuser's (`<release>-superuser`, which
only the server's own initialisation reads) and each database's role's (`<release>-<name>`).
*/ -}}
{{- if not (.Capabilities.APIVersions.Has "generators.external-secrets.io/v1alpha1/Password") }}
{{- fail "the PostgreSQL fixture generates its passwords with the External Secrets Operator's Password generator, and this cluster does not serve generators.external-secrets.io/v1alpha1" }}
{{- end }}
{{- range $name := prepend .Values.databases "superuser" }}
{{- $secret := printf "%s-%s" $.Release.Name $name }}
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: {{ $secret }}
  labels:
    {{- include "postgres.labels" $ | nindent 4 }}
spec:
  length: 40
  digits: 10
  symbols: 0
  noUpper: false
  allowRepeat: true
  secretKeys: [password]
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $secret }}
  labels:
    {{- include "postgres.labels" $ | nindent 4 }}
spec:
  refreshPolicy: CreatedOnce
  target:
    name: {{ $secret }}
    creationPolicy: Owner
    template:
      data:
        password: "{{ `{{ .password }}` }}"
        {{- if ne $name "superuser" }}
        pgpass: "*:*:{{ $name }}:{{ $name }}:{{ `{{ .password }}` }}"
        {{- end }}
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: {{ $secret }}
---
{{- end }}
