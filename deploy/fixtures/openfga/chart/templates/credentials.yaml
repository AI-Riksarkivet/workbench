{{- /*
The database password and the preshared key, generated once in the cluster by the External Secrets Operator's Password
generator (`refreshPolicy: CreatedOnce`), and the server's config file assembled from them, so neither value is in git
or in any environment. One Secret carries all three: the database's bootstrap credential (`username`, `password`, which
the CloudNativePG Cluster reads), the client's key (`preshared-key`, which the workbench mounts) and `config.yaml`
(which the server mounts at /etc/openfga).
*/ -}}
{{- if not (.Capabilities.APIVersions.Has "generators.external-secrets.io/v1alpha1/Password") }}
{{- fail "the OpenFGA fixture generates its credentials with the External Secrets Operator's Password generator, and this cluster does not serve generators.external-secrets.io/v1alpha1" }}
{{- end }}
{{- range $name := list "database" "key" }}
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: {{ $.Release.Name }}-{{ $name }}
  labels:
    {{- include "openfga.labels" $ | nindent 4 }}
spec:
  length: 40
  digits: 10
  symbols: 0
  noUpper: false
  allowRepeat: true
  secretKeys: [{{ $name }}]
---
{{- end }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.secretName }}
  labels:
    {{- include "openfga.labels" . | nindent 4 }}
spec:
  refreshPolicy: CreatedOnce
  target:
    name: {{ .Values.secretName }}
    creationPolicy: Owner
    template:
      type: kubernetes.io/basic-auth
      data:
        username: openfga
        password: "{{ `{{ .database }}` }}"
        preshared-key: "{{ `{{ .key }}` }}"
        config.yaml: |
          datastore:
            engine: postgres
            uri: "postgres://openfga:{{ `{{ .database }}` }}@{{ include "openfga.database" . }}-rw:5432/openfga?sslmode=verify-full&sslrootcert=/etc/openfga-database-ca/ca.crt"
          authn:
            method: preshared
            preshared:
              keys: ["{{ `{{ .key }}` }}"]
          playground:
            enabled: false
          http:
            addr: 0.0.0.0:{{ .Values.port }}
  dataFrom:
    {{- range $name := list "database" "key" }}
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: {{ $.Release.Name }}-{{ $name }}
    {{- end }}
