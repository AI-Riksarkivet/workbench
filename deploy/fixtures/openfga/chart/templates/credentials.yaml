{{- /*
The preshared key, generated once in the cluster by the External Secrets Operator's Password generator
(`refreshPolicy: CreatedOnce`), and the server's config file assembled around it, so it is neither in git nor in any
environment. One Secret carries both: the client's key (`preshared-key`, which the workbench mounts) and
`config.yaml` (which the server mounts at /etc/openfga). The config names the database and no password: the server
reads its role's from the password file `database.credential` names (`passfile`), mounted beside the CA.
*/ -}}
{{- if not (.Capabilities.APIVersions.Has "generators.external-secrets.io/v1alpha1/Password") }}
{{- fail "the OpenFGA fixture generates its preshared key with the External Secrets Operator's Password generator, and this cluster does not serve generators.external-secrets.io/v1alpha1" }}
{{- end }}
{{- with .Values.database }}
{{- if not (and .host .credential.name .ca.name) }}{{ fail "database: the OpenFGA fixture needs its PostgreSQL's host, the Secret holding its password file (credential.name) and the one holding its CA (ca.name)" }}{{ end }}
{{- end }}
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: {{ .Release.Name }}-key
  labels:
    {{- include "openfga.labels" . | nindent 4 }}
spec:
  length: 40
  digits: 10
  symbols: 0
  noUpper: false
  allowRepeat: true
  secretKeys: [key]
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.secretName }}
  labels:
    {{- include "openfga.labels" . | nindent 4 }}
spec:
  refreshPolicy: CreatedOnce
  target:
    name: {{ .Values.secretName }}
    creationPolicy: Owner
    template:
      data:
        preshared-key: "{{ `{{ .key }}` }}"
        config.yaml: |
          datastore:
            engine: postgres
            uri: "postgres://{{ .Values.database.user }}@{{ .Values.database.host }}:{{ .Values.database.port }}/{{ .Values.database.name }}?sslmode=verify-full&sslrootcert=/etc/openfga-database/ca.crt&passfile=/etc/openfga-database/pgpass"
          authn:
            method: preshared
            preshared:
              keys: ["{{ `{{ .key }}` }}"]
          playground:
            enabled: false
          http:
            addr: 0.0.0.0:{{ .Values.port }}
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: {{ .Release.Name }}-key
