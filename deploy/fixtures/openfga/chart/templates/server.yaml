{{- $selector := include "openfga.labels" . | fromYaml }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}
  labels:
    {{- toYaml $selector | nindent 4 }}
automountServiceAccountToken: false
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
  labels:
    {{- toYaml $selector | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - { name: http, port: {{ .Values.port }}, targetPort: http }
  selector:
    {{- toYaml $selector | nindent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels:
    {{- toYaml $selector | nindent 4 }}
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      {{- toYaml $selector | nindent 6 }}
  template:
    metadata:
      labels:
        {{- toYaml $selector | nindent 8 }}
    spec:
      serviceAccountName: {{ .Release.Name }}
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile: { type: RuntimeDefault }
      # The schema first, idempotently, on the same config: a pod whose database is not up yet retries here.
      initContainers:
        - name: migrate
          image: {{ .Values.image }}
          args: ["migrate"]
          securityContext: &restricted
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts: &mounts
            - { name: config, mountPath: /etc/openfga, readOnly: true }
            - { name: database, mountPath: /etc/openfga-database, readOnly: true }
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      containers:
        - name: openfga
          image: {{ .Values.image }}
          args: ["run"]
          securityContext: *restricted
          ports:
            - { name: http, containerPort: {{ .Values.port }} }
          volumeMounts: *mounts
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: config
          secret:
            secretName: {{ .Values.secretName }}
            items: [{ key: config.yaml, path: config.yaml }]
        # What the server reaches its database with: the role's password file and the CA its certificate is verified
        # against, each alone from its Secret.
        - name: database
          projected:
            defaultMode: 0440
            sources:
              - secret:
                  name: {{ .Values.database.credential.name }}
                  items: [{ key: {{ .Values.database.credential.key }}, path: pgpass }]
              - secret:
                  name: {{ .Values.database.ca.name }}
                  items: [{ key: {{ .Values.database.ca.key }}, path: ca.crt }]
