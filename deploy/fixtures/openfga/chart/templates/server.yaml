{{- $selector := include "openfga.labels" . | fromYaml }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}
  labels:
    {{- toYaml $selector | nindent 4 }}
automountServiceAccountToken: false
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
  labels:
    {{- toYaml $selector | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - { name: http, port: {{ .Values.port }}, targetPort: http }
  selector:
    {{- toYaml $selector | nindent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels:
    {{- toYaml $selector | nindent 4 }}
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      {{- toYaml $selector | nindent 6 }}
  template:
    metadata:
      labels:
        {{- toYaml $selector | nindent 8 }}
    spec:
      serviceAccountName: {{ .Release.Name }}
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile: { type: RuntimeDefault }
      # The schema first, idempotently, on the same config: a pod whose database is not up yet retries here.
      initContainers:
        - name: migrate
          image: {{ .Values.image }}
          args: ["migrate"]
          securityContext: &restricted
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts: &mounts
            - { name: config, mountPath: /etc/openfga, readOnly: true }
            - { name: database-ca, mountPath: /etc/openfga-database-ca, readOnly: true }
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      containers:
        - name: openfga
          image: {{ .Values.image }}
          args: ["run"]
          securityContext: *restricted
          ports:
            - { name: http, containerPort: {{ .Values.port }} }
          volumeMounts: *mounts
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: config
          secret:
            secretName: {{ .Values.secretName }}
            items: [{ key: config.yaml, path: config.yaml }]
        # The database Cluster's CA alone, never its key: the server verifies the database's certificate.
        - name: database-ca
          secret:
            secretName: {{ include "openfga.database" . }}-ca
            items: [{ key: ca.crt, path: ca.crt }]
