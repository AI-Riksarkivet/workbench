{{- if not (.Capabilities.APIVersions.Has "postgresql.cnpg.io/v1/Cluster") }}
{{- fail "the OpenFGA fixture keeps its tuples on a CloudNativePG Cluster, and this cluster does not serve postgresql.cnpg.io/v1" }}
{{- end }}
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: {{ include "openfga.database" . }}
  labels:
    {{- include "openfga.labels" . | nindent 4 }}
spec:
  instances: {{ .Values.database.instances }}
  {{- with .Values.database.imageName }}
  imageName: {{ . | quote }}
  {{- end }}
  enableSuperuserAccess: false
  storage:
    size: {{ .Values.database.storage | quote }}
  bootstrap:
    initdb:
      database: openfga
      owner: openfga
      # The generated credential (`credentials.yaml`), so the server's config names a password the Cluster was made with.
      secret:
        name: {{ .Values.secretName }}
