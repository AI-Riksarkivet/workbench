# The rask release this annotator sits beside. Every rask name below derives from it: the Deployment, Service and
# ServiceAccount `<rask>-annotator` / `<rask>-sa-annotator`, and the rask object this pod reaches by reference,
# `<rask>-catalog`.
rask:
  release: rask

image:
  # A bare name is a side-loaded image on the node (make k3s-import); a registry path is pulled.
  repository: annotator
  tag: dev
  pullPolicy: IfNotPresent

# One replica: the Dapr actors place each project and task on one host, and a second replica is a second host the
# placement service shards across, not a second copy of the state.
replicas: 1
port: 8103

# The Gateway route publishing /api/explorer/annotations on the Gateway rask's own routes attach to (rask's `route.*`):
# the product chart renders no part of this service (ADR 0171), so it publishes itself.
route:
  enabled: true
  # The public prefix, rewritten to the service's own `/api/annotations` mount.
  prefix: /api/explorer/annotations
  # rask's `route.parentRefs`. Required while `enabled`.
  parentRefs: []
  # rask's `route.hostnames`.
  hostnames: []

# rask's `networkPolicy.enabled`: on, rask renders a default-deny that selects every pod in the namespace, so this
# release admits the Gateway's traffic on `port` alone. Off, it renders no policy.
networkPolicy:
  enabled: false
  # rask's `networkPolicy.apiServerEgress`: the egress rules reaching the Kubernetes API server, which the state
  # Cluster's instance managers watch it through. Required while `enabled`.
  apiServerEgress: []
# Interactive API docs (MEDIA_DOCS).
docs: false
# Peers whose x-forwarded-* headers uvicorn trusts (rask's `forwardedAllowIps`); `*` is refused.
forwardedAllowIps: 127.0.0.1

# The lakehouse, by reference. The annotator reads governed tables through the catalog's doors as the person, on a token
# it exchanges for them at the identity provider (the corpus on the credential the catalog vends them), and writes
# annotations and publishes as the workbench's own confidential client, naming the person in each commit.
catalog:
  # Empty derives `http://<rask>-catalog:2333`.
  url: ""

# The annotator's own state: its projects, tasks, drafts, leases and roles are Dapr actors on a state store scoped to it
# alone, on a CloudNativePG Postgres this release renders (the CloudNativePG operator is a prerequisite: in development
# the `cloudnative-pg` fixture). The connection credential is the Cluster's generated `<cluster>-app` Secret, which only
# this release's ServiceAccount may read, through a Kubernetes secret store scoped to this app, and the sidecar verifies
# the server against the Cluster's own CA.
state:
  instances: 1
  storage: 2Gi
  # The Postgres image the Cluster runs; empty takes the operator's default for its version.
  imageName: ""
  # The CloudNativePG operator's namespace, admitted to each instance's status port while `networkPolicy.enabled`.
  operatorNamespace: cnpg-system

dapr:
  # The sidecar the actors and the state store need. Rendered only on a cluster that serves dapr.io/v1alpha1.
  enabled: true
  appId: annotator
  logLevel: info
  maxBodySize: 32Mi
  sidecarResources:
    cpuRequest: 50m
    cpuLimit: 300m
    memoryRequest: 64Mi
    memoryLimit: 256Mi

# rask's `lifecycle`: the pod's grace period, the preStop drain, the lifespan teardown after uvicorn's drain, and how
# long the sidecar outlives the app.
lifecycle:
  terminationGracePeriodSeconds: 40
  preStopSeconds: 5
  teardownSeconds: 10
  sidecarBlockShutdownSeconds: 20

# Telemetry to an OTLP/HTTP endpoint; empty `endpoint` derives rask's Collector (`<rask>-otel-collector:4318`). Off sends
# nothing. `environment` is rask's `observability.environment`.
otel:
  enabled: true
  endpoint: ""
  environment: rask
  # The sidecar's trace sampling (rask's `observability.samplingRate`).
  samplingRate: "1"

# Sign-in and authorization, the workbench's own. Every request names a person the platform's OIDC provider vouched for,
# in a DPoP-bound token addressed to the workbench's own audience; what they may do is the workbench's own OpenFGA store.
# Off (a local stack only), the annotator answers anonymously and every check allows, and it says so at startup
# (WORKBENCH_INSECURE_ALLOW_UNAUTHENTICATED); a production install leaves it on.
auth:
  enabled: true
  # Emit the authn/authz audit stream (WORKBENCH_AUDIT_ENABLED).
  audit: true
  oidc:
    # The provider's issuer, exactly: a token is accepted only when its `iss` equals it. Required.
    issuer: ""
    # Where discovery and the key set are fetched when that differs from the issuer (a provider behind a proxy).
    discoveryUrl: ""
    # The workbench's own audience, which its public sign-in client requests. A token addressed to anything else,
    # the lakehouse's among them, is refused.
    audience: workbench
    # The idp id the provider's subjects are principals of (`<idp-id>~<sub>`). Required.
    idpId: ""
    # The URL the browser addresses this service by, which each DPoP proof's `htu` names: the public origin and this
    # release's route prefix (`route.prefix`). Required.
    publicUrl: ""
    # How far a DPoP proof's `iat` may lie from now, and how long its `jti` is remembered against a replay.
    dpopWindowSeconds: 60
    # The workbench's confidential client at the provider: it exchanges a person's token for one addressed to the
    # lakehouse (RFC 8693) and takes its own for the writes it makes as itself. Its secret is mounted from a Secret.
    client:
      id: workbench-services
      secret:
        # The Secret holding the client's secret, which the platform's secret operator provides. Required.
        name: ""
        key: client-secret
  # The lakehouse's audience: the audience of every token the annotator asks the provider for. Required.
  lakehouseAudience: ""
  # The lakehouse namespace holding the workbench's annotation tables (`<warehouse>$<namespace>`), which the workbench's
  # own identity is granted to write in the lakehouse: one table per (project, dataset).
  annotationsNamespace: workbench$annotations
  # The workbench's own OpenFGA store, on the platform's OpenFGA, by reference.
  fga:
    # The platform's OpenFGA. Required.
    apiUrl: ""
    # The store's name: the model writer creates it, and the annotator finds it by it.
    store: workbench
    # The Secret holding the store's preshared key, mounted as a file; empty presents none, which only an OpenFGA
    # authenticating nobody admits.
    credential:
      name: ""
      key: preshared-key
    # The organisations git declares: who administers each and who belongs to it, by principal key. The model writer
    # makes the store hold exactly these, and nothing else grants an organisation role.
    orgs: {}
    #   acme:
    #     admins: [keycloak~3f1c...]
    #     members: [keycloak~9a02...]

# Assist producer discovery from a Ray Serve control plane (ANNOTATOR_SERVE_DISCOVERY_URL / _PROXY_URL); empty renders
# none, and assist answers from its registry and its mock.
serve:
  discoveryUrl: ""
  proxyUrl: ""

# The assist runner: the annotator's interactive model server (GroundingDINO-tiny + SAM-ViT-base, CPU, runners/assist).
# Off, assist answers with its deterministic mock.
assist:
  enabled: false
  image:
    repository: assist-runner
    tag: dev
  port: 8110
  # The origin the runner fetches frames from (the viewer). Empty derives `http://<rask>-viewer:8101`.
  frameBase: ""
  # Two warm torch models: the request-pod default would OOM-kill the runner at load.
  resources:
    requests: { cpu: "1", memory: 2Gi }
    limits: { cpu: "8", memory: 6Gi }

# A RayJob submit endpoint for batch labeling (ANNOTATOR_JOBS_URL); empty keeps the annotator's submit/poll mock.
jobsUrl: ""

resources:
  requests: { cpu: 100m, memory: 512Mi }
  limits: { cpu: "1", memory: 1536Mi }
