{{- /*
DEVELOPMENT ONLY (`dev.secrets.enabled`): the Secrets this release mounts, made in the cluster so a development install
from git is complete. The media-URL signing key and OpenFGA's preshared key are generated by the External Secrets
Operator's Password generator once and kept (rask's own development credentials are made the same way); the confidential
client's secret is the development identity provider's literal for the same client (`dex-client.yaml`), as rask's Dex
fixture declares its own machine clients'. A production install leaves this off and names Secrets the platform provides.
*/ -}}
{{- if .Values.dev.secrets.enabled }}
{{- if not (.Capabilities.APIVersions.Has "generators.external-secrets.io/v1alpha1/Password") }}
{{- fail "dev.secrets.enabled generates keys with the External Secrets Operator's Password generator, and this cluster does not serve generators.external-secrets.io/v1alpha1. A cluster-less render names it: --api-versions generators.external-secrets.io/v1alpha1/Password" }}
{{- end }}
{{- $selector := include "annotator.selector" . | fromYaml }}
{{- /* Each generated key: the Secret's name, its key, and its length in base64 characters (44 decode to 33 bytes, the
viewer's floor being 32). */ -}}
{{- $generated := list (list .Values.media.viewer.mediaUrlKey.name .Values.media.viewer.mediaUrlKey.key) }}
{{- if .Values.auth.fga.credential.name }}
{{- $generated = append $generated (list .Values.auth.fga.credential.name .Values.auth.fga.credential.key) }}
{{- end }}
{{- range $generated }}
{{- $name := index . 0 }}{{- $key := index . 1 }}
{{- if not $name }}{{ fail "dev.secrets.enabled names each generated Secret: media.viewer.mediaUrlKey.name" }}{{ end }}
---
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: {{ $name }}
  labels:
    {{- toYaml $selector | nindent 4 }}
spec:
  length: 44
  digits: 10
  symbols: 0
  noUpper: false
  allowRepeat: true
  secretKeys: [{{ $key }}]
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $name }}
  labels:
    {{- toYaml $selector | nindent 4 }}
spec:
  refreshPolicy: CreatedOnce
  target:
    name: {{ $name }}
    creationPolicy: Owner
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: {{ $name }}
{{- end }}
{{- if .Values.auth.enabled }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ required "auth.oidc.client.secret.name: the Secret holding the workbench client's secret" .Values.auth.oidc.client.secret.name }}
  labels:
    {{- toYaml $selector | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.auth.oidc.client.secret.key }}: {{ required "dev.secrets.oidcClientSecret: the development identity provider's secret for the workbench's client" .Values.dev.secrets.oidcClientSecret | quote }}
{{- end }}
{{- end }}
