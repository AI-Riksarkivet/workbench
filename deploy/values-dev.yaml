# The development estate's settings: the workbench beside the dev estate's rask release (k3s, Traefik's Gateway, the dev
# Dex), in a namespace of its own (`workbench`), reached at http://workbench.localhost:8080 through the same port-forward
# to the Gateway that reaches rask's console at http://localhost:8080. NOT FOR PRODUCTION.
#
# The dev Dex binds no token and exchanges none of its own (its discovery read 2026-11-16 advertises no
# `dpop_signing_alg_values_supported`; its token-exchange grant takes only an upstream connector's token), so the app
# asks for the lakehouse's audience beside its own (Dex's cross-client scope, which rask's audience client issues to
# every client in the fixture's `clients`, `deploy/dex-client.yaml`), the token is a bearer, and the services pass it on.
#
# `make deploy-dev` installs the chart (`chart/`) as release `workbench` in namespace `workbench` with this file alone
# and the image tags of the commit it builds (docs/DEPLOY.md).
docs: true
# The Gateway rask's routes attach to (rask's deploy/values-local.yaml), under a hostname of the workbench's own: rask's
# console holds `/` with no hostname, and a route naming a hostname wins over it (Gateway API's precedence).
route:
  parentRefs: [{name: traefik-gateway, namespace: kube-system, sectionName: web}]
  hostnames: [workbench.localhost]
# The Gateway's data plane runs in the k3s pod CIDR, as rask's `forwardedAllowIps` in deploy/values-local.yaml.
forwardedAllowIps: 10.42.0.0/16
# rask's catalog and Collector, reached across namespaces by their Services' namespace-qualified names; rask is read as
# the person whose token Dex issued (`auth.lakehouse.delegation: forward`).
sources:
  - name: lake
    title: The dev estate's lakehouse
    kind: rask
    uri: http://rask-catalog.default.svc:2333
  # The workbench's own demo data (`demo` below): the corpus, recordings and films the local stack seeds, in the
  # directory catalog the demo Job writes at `lakehouse/` on the release's demo claim, read-only. No catalog knows the
  # person here, so the workbench's own OpenFGA decides who reads it: the dev Dex's five demo people, named as rask
  # names them (`dex~<the local connector's user id>`, rask's deploy/fixtures/dex/chart/values.yaml).
  - name: demo
    title: Workbench demo (corpus, recordings, films)
    kind: namespace
    impl: dir
    claim: workbench-demo
    path: lakehouse
    # Its items may be sent to a project and labelled; the work stays in the annotator's own Postgres until a publish.
    annotatable: true
    readers:
      people:
        - dex~08a8684b-db88-4b73-90a9-3cd1661f5466 # alice
        - dex~1b6e2f5a-7c4d-4e9b-9f1a-2d3c4b5a6e7f # bob
        - dex~718ae9f8-ab91-403e-a07c-cd1caf667cce # carol
        - dex~a7d3182d-0d75-4ce6-930f-dcb5c0d9f8ad # dave
        - dex~bbca9aad-6c7c-4bcd-a88e-f74abbae1185 # erin
demo:
  enabled: true
otel:
  enabled: true
  endpoint: http://rask-otel-collector.default.svc:4318
  environment: dev
image:
  repository: localhost:5000/workbench-annotator
media:
  image:
    repository: localhost:5000/workbench-media
  viewer:
    mediaUrlKey:
      name: workbench-media-url-key
auth:
  oidc:
    # The dev Dex's issuer as the browser reaches it, and where the pods fetch its discovery and keys in-cluster.
    issuer: http://localhost:8080/dex
    discoveryUrl: http://rask-dex.default.svc:5556/dex
    # Under Dex, the app's own client id: Dex adds the requesting client to every cross-client token's `aud`.
    audience: workbench-app
    # As rask names the dev Dex's people (rask's `auth.oidc.idpId` and `connectors` with `dex.enabled`).
    idpId: dex
    connectors: { local: dex }
    publicOrigin: http://workbench.localhost:8080
    dpopRequired: false
    client:
      id: workbench-services
      secret:
        name: workbench-oidc-client
  lakehouse:
    audience: rask-lakehouse
    audienceScope: audience:server:client_id:rask-lakehouse
    delegation: forward
  # The workbench's own OpenFGA, the development fixture `deploy/fixtures/openfga` in this namespace, and the preshared
  # key it generates.
  fga:
    apiUrl: http://workbench-openfga:8080
    credential:
      name: workbench-openfga
      key: preshared-key
    # The dev Dex's alice (rask's estate admin, `scripts/dex_principal.py` in rask) administers `acme`.
    orgs:
      acme:
        admins: [dex~08a8684b-db88-4b73-90a9-3cd1661f5466]
        members: [dex~1b6e2f5a-7c4d-4e9b-9f1a-2d3c4b5a6e7f]
dev:
  secrets:
    enabled: true
    # The same development-only literal `dex-client.yaml` gives the dev Dex for `workbench-services`.
    oidcClientSecret: workbench-services-dev-secret
app:
  image:
    repository: localhost:5000/workbench-app
  oidc:
    scopes: [openid, profile, email, offline_access, federated:id, "audience:server:client_id:rask-lakehouse"]
networkPolicy:
  enabled: true
  # The API server as a policy sees it, after the Service's translation: the node's address, port 6443 (the dev
  # estate's `kubernetes` endpoints, read 2026-11-16).
  apiServerEgress:
    - to:
        - ipBlock: { cidr: 10.16.51.55/32 }
      ports:
        - { protocol: TCP, port: 6443 }
