[project]
name = "flows"
version = "0.1.0"
description = "the flows service — the studio flow-builder's server half: a declared node catalog, pure graph validation, and durable run execution, each run and its steps kept in its own Postgres."
requires-python = ">=3.13"
license = "Apache-2.0"
dependencies = [
    "workbench",
    # The regex NODE's engine, and declared here for the reason the comment above already paid for:
    # the image's venv is `uv sync --package flows` alone, so a transitive dep from another workspace
    # member is present locally and ABSENT in the image. `regex` is a superset of `re` (every pattern
    # a user has drawn keeps its meaning) and is not a naive backtracker: measured on `(a+)+$` against
    # "a"*n+"X", `re` took 76.5s at n=30 while `regex` answered in 0.0003s. It also accepts a
    # `timeout=` the stdlib has no equivalent for, which is the backstop for whatever it does not
    # optimise. `re` stays for the fixed internal patterns, which no caller influences.
    "regex>=2024.5.15",
    "httpx>=0.27",
    # The bounded retry of a call Serve did not answer yet (`flows.executor.SERVE_ATTEMPTS`).
    "tenacity>=9.1.4",
    "uvicorn>=0.30",
    # The run store (`flows.store`): psycopg 3 with its connection pool. The binary extra carries libpq, so the image
    # needs no system Postgres client library.
    "psycopg[binary,pool]>=3.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flows"]

[tool.uv.sources]
workbench = { workspace = true }
