[project]
name = "viewer"
version = "0.1.0"
description = "Media-plane viewer API — documents, blob columns and Range-streamed media over Lance tables."
requires-python = ">=3.13"
license = "Apache-2.0"
dependencies = [
    "workbench",
    "fastapi>=0.115",
    "pydantic>=2.7",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pylance[otel]>=13.0.0",
    "lance-graph>=0.5.4",
    "pyarrow",
    "numpy",
    # PyAV: FFmpeg's demuxers and decoders as a library (its wheels carry them), so a recording's waveform peaks are
    # decoded from its blob as a stream, packet by packet, with no ffmpeg binary in the image and no file on disk
    # (`viewer.services.peaks`).
    "av>=19.0.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/viewer"]

[tool.uv.sources]
workbench = { workspace = true }

[tool.ruff]
extend = "../../pyproject.toml"

# The ROOT banned-api map, restated, then this service's own bans. A nested banned-api table replaces
# the root one rather than merging with it (measured, ruff 0.16.0: a child declaring one ban stopped
# enforcing the root's), so every root ban is repeated here and a ban added to the root map is added
# here too. The root per-file ignores still apply under this directory (measured).
[tool.ruff.lint.flake8-tidy-imports.banned-api]
"dataclasses.dataclass".msg = "Structured values are pydantic BaseModel (CLAUDE.md, writing-python)."
"boto3".msg = "No raw S3 client: data is reached through lance-namespace, on the storage options the catalog vends."
"lance.write_dataset".msg = "The viewer writes no Lance: it reads what its sources hold."
"lance.fragment.write_fragments".msg = "The viewer writes no Lance: it reads what its sources hold."
"signal.signal".msg = "SIGTERM is taken only by workbench.draining; a second handler replaces the drain."
"pyarrow.ipc.open_stream".msg = "Decode an Arrow IPC body only through workbench.arrow_ipc: it bounds and validates what a caller sends."
"pyarrow.ipc.open_file".msg = "Decode an Arrow IPC body only through workbench.arrow_ipc: it bounds and validates what a caller sends."
"pyarrow.ipc.RecordBatchStreamReader".msg = "Decode an Arrow IPC body only through workbench.arrow_ipc: it bounds and validates what a caller sends."
"pyarrow.ipc.RecordBatchFileReader".msg = "Decode an Arrow IPC body only through workbench.arrow_ipc: it bounds and validates what a caller sends."
"pyarrow.ipc.MessageReader".msg = "Decode an Arrow IPC body only through workbench.arrow_ipc: it bounds and validates what a caller sends."
"pyarrow.ipc.read_message".msg = "Decode an Arrow IPC body only through workbench.arrow_ipc: it bounds and validates what a caller sends."
"pyarrow.ipc.read_record_batch".msg = "Decode an Arrow IPC body only through workbench.arrow_ipc: it bounds and validates what a caller sends."
"pyarrow.ipc.read_schema".msg = "Decode an Arrow IPC body only through workbench.arrow_ipc: it bounds and validates what a caller sends."
"pyarrow.RecordBatchStreamReader".msg = "Decode an Arrow IPC body only through workbench.arrow_ipc: it bounds and validates what a caller sends."
"pyarrow.RecordBatchFileReader".msg = "Decode an Arrow IPC body only through workbench.arrow_ipc: it bounds and validates what a caller sends."
"pyarrow.feather".msg = "Decode an Arrow IPC body only through workbench.arrow_ipc: it bounds and validates what a caller sends."
"workbench.governed.fga.provision".msg = "Only the model writer (workbench.governed.auth.write_model) provisions the OpenFGA store and model."
"os.getenv".msg = "Declare the value on ViewerSettings."
"os.environ".msg = "Declare the value on ViewerSettings."
