[project]
name = "annotator"
version = "0.1.0"
description = "The annotator: a labeling tool that works on the lakehouse through its public doors, with its own release, state and roles."
requires-python = ">=3.13"
license = "Apache-2.0"
dependencies = [
    "workbench",
    "fastapi>=0.115",
    "pydantic>=2.7",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pylance[otel]>=13.0.0",
    "pyarrow",
    "shapely>=2.0",
    # The annotator's own state store (`annotator.state`): psycopg 3 with its connection pool. The binary extra carries
    # libpq, so the image needs no system Postgres client library.
    "psycopg[binary,pool]>=3.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/annotator"]

[tool.uv.sources]
workbench = { workspace = true }
