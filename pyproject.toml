[project]
name = "workbench"
version = "0.1.0"
description = "Workbench uv workspace root (no entry points; deployables build via `uv sync --package <name>`)."
requires-python = ">=3.13"
license = "Apache-2.0"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
bypass-selection = true

[tool.uv.workspace]
# Language-pure directories, so the globs are safe: every directory under packages/ and services/ carries a
# pyproject.toml. The JS plane is frontend/, a bun workspace of its own. runners/* are not members: a runner is a sealed
# model environment with its own lock, whose pins (CUDA torch, model SDKs) must never enter the services' resolution.
members = ["packages/*", "services/*"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.25",
    "pytest-cov>=7.0",
    "pytest-timeout>=2.3",
    "pytest-xdist>=3.6",
    "moto[s3,server]>=5.0",
    "respx>=0.21",
    "requests>=2.32",
    "ruff",
    "ty",
]

[tool.ruff]
line-length = 160

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "S", "C4", "SIM", "RUF", "C901", "RET", "PERF", "FURB", "A", "ANN"]
ignore = ["S101", "S104", "ANN001", "ANN003", "ANN204", "RET504"]
extend-select = ["TID251", "FAST001"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = [
    "TID251", "A002", "ANN002", "ANN201", "ANN202", "ANN401", "C901", "E501", "PERF401",
    "RUF001", "RUF002", "RUF003", "RUF005", "RUF012", "RUF043", "RUF100",
    "S101", "S105", "S106", "S107", "S108", "S110", "S112", "S113", "S310", "S324", "S603", "S607", "S608", "SIM108",
]
"scripts/**" = ["TID251"]
"services/viewer/**" = ["A002", "ANN401", "ANN201", "ANN202", "ANN002", "RUF001", "RUF002", "RUF003", "RUF005", "RUF012", "RUF043", "RUF100", "C901", "PERF401", "SIM108", "S110", "S112", "S310", "S324", "S608", "E501"]
"services/search/**" = ["A002", "ANN401", "ANN201", "ANN202", "ANN002", "RUF001", "RUF002", "RUF003", "RUF005", "RUF012", "RUF043", "RUF100", "C901", "PERF401", "SIM108", "S110", "S112", "S310", "S324", "S608", "E501"]
"services/annotator/**" = ["A002", "ANN401", "ANN201", "ANN202", "ANN002", "RUF001", "RUF002", "RUF003", "RUF005", "RUF012", "RUF043", "RUF100", "C901", "PERF401", "SIM108", "S110", "S112", "S310", "S324", "S608", "E501"]
"services/viewer/src/viewer/services/clips.py" = ["S603"]
"services/viewer/src/viewer/services/audio_prep.py" = ["S603"]
"services/annotator/src/annotator/projects/proxies.py" = ["TID251"]  # ActorProxy: the proxies module
"packages/service-kit/src/service_kit/governed/**" = ["ANN401", "ANN202", "C901", "PERF401"]
"packages/service-kit/src/service_kit/draining.py" = ["TID251"]  # signal: the drain seam
"packages/service-kit/src/service_kit/arrow_ipc.py" = ["TID251"]  # arrow ipc: the validating decoder
"packages/client-kit/src/client_kit/lancekit/catalog.py" = ["A002"]  # `filter=` is the lance dataset API's own parameter name
"packages/client-kit/src/client_kit/lancekit/**" = ["ANN401", "C901", "PERF401"]
"packages/client-kit/src/client_kit/media/**" = ["E501"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"dataclasses.dataclass".msg = "Structured values are pydantic BaseModel (CLAUDE.md, writing-python)."
"boto3".msg = "No raw S3 client: data is reached through lance-namespace, on the storage options the catalog vends."
"signal.signal".msg = "SIGTERM is taken only by service_kit.draining; a second handler replaces the drain."
"pyarrow.ipc.open_stream".msg = "Decode an Arrow IPC body only through service_kit.arrow_ipc: it bounds and validates what a caller sends."
"pyarrow.ipc.open_file".msg = "Decode an Arrow IPC body only through service_kit.arrow_ipc: it bounds and validates what a caller sends."
"pyarrow.ipc.RecordBatchStreamReader".msg = "Decode an Arrow IPC body only through service_kit.arrow_ipc: it bounds and validates what a caller sends."
"pyarrow.ipc.RecordBatchFileReader".msg = "Decode an Arrow IPC body only through service_kit.arrow_ipc: it bounds and validates what a caller sends."
"pyarrow.ipc.MessageReader".msg = "Decode an Arrow IPC body only through service_kit.arrow_ipc: it bounds and validates what a caller sends."
"pyarrow.ipc.read_message".msg = "Decode an Arrow IPC body only through service_kit.arrow_ipc: it bounds and validates what a caller sends."
"pyarrow.ipc.read_record_batch".msg = "Decode an Arrow IPC body only through service_kit.arrow_ipc: it bounds and validates what a caller sends."
"pyarrow.ipc.read_schema".msg = "Decode an Arrow IPC body only through service_kit.arrow_ipc: it bounds and validates what a caller sends."
"pyarrow.RecordBatchStreamReader".msg = "Decode an Arrow IPC body only through service_kit.arrow_ipc: it bounds and validates what a caller sends."
"pyarrow.RecordBatchFileReader".msg = "Decode an Arrow IPC body only through service_kit.arrow_ipc: it bounds and validates what a caller sends."
"pyarrow.feather".msg = "Decode an Arrow IPC body only through service_kit.arrow_ipc: it bounds and validates what a caller sends."

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint.isort]
lines-after-imports = 2
# Every first-party import name: one missing sorts into the third-party block. Add or remove a name in the change that
# adds or deletes its member.
known-first-party = [
    "annotator",
    "client_kit",
    "flows",
    "search",
    "service_kit",
    "tests",
    "viewer",
]

[tool.ty.terminal]
error-on-warning = true

[tool.ty.environment]
python-version = "3.13"
# The live harness the annotator's live suites import by its flat name.
extra-paths = ["services/annotator/tests/live"]

[tool.ty.src]
exclude = ["**/.venv", "**/node_modules", "**/.claude/worktrees", "runners"]

[tool.pytest.ini_options]
# Globbed, so a member's tests/ runs the moment it exists; a new top-level tests/<x>/ is added here by hand.
testpaths = ["packages/*/tests", "services/*/tests"]
addopts = "--import-mode=importlib"
pythonpath = ["."]
empty_parameter_set_mark = "fail_at_collect"
strict_markers = true
markers = [
    "e2e: suites needing a running stack and a reachable rask lakehouse (deselect with '-m \"not e2e\"')",
    "slow: tests that load a model or a large fixture",
    "annotator: the annotator's suites against a live stack",
    "media_catalog: the media services against a live catalog",
]

[tool.coverage.run]
branch = true
source = ["services", "packages"]
omit = ["**/tests/*"]

[tool.coverage.report]
include_namespace_packages = true
